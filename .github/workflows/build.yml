name: Build Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build 3105
    runs-on: macos-14
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

    - name: Build App
      run: |
        xcodebuild -project ThreeOneOSFive.xcodeproj \
          -scheme ThreeOneOSFive \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath ./build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package to IPA
      run: |
        mkdir -p Payload
        cp -r ./build/Build/Products/Release-iphoneos/*.app ./Payload/
        zip -r 3105_unsigned.zip Payload/
        mv 3105_unsigned.zip 3105.ipa

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 3105-Unsigned-IPA
        path: 3105.ipa
